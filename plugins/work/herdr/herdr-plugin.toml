id = "work.session"
name = "Work: session binding"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Ask an unbound herdr session which Linear scope it is for, and show that scope"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/../bin/session-start.sh\""]

[[actions]]
id = "bind"
title = "Bind this session to a Linear scope"
contexts = ["workspace"]
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/../bin/session-bind.sh\" open"]

[[panes]]
id = "bind"
title = "Bind this session"
placement = "popup"
width = "70%"
height = 24
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/../bin/session-bind.sh\""]
